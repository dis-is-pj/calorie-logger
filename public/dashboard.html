<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Meal Calorie Logger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .top-row {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: #111; letter-spacing: -0.3px; }

    a.back-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4f46e5;
      text-decoration: none;
    }
    a.back-link:hover { text-decoration: underline; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .stat-row {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
    }
    .stat-box {
      flex: 1;
      background: #f8f7ff;
      border: 1px solid #e0e7ff;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-box .num { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; }
    .stat-box .label { font-size: 0.72rem; color: #6b7280; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

    .log-list { margin-top: 16px; }
    .log-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.88rem; }
    .log-row:last-child { border-bottom: none; }

    .log-row-view { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .log-row-view .meta { color: #333; flex: 1; min-width: 0; }
    .log-row-view .meta .meal-type {
      font-size: 0.68rem;
      font-weight: 700;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: block;
      margin-bottom: 2px;
    }
    .log-row-view .nums { color: #666; white-space: nowrap; }

    .log-row-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #9ca3af;
      padding: 2px 5px;
      line-height: 1;
    }
    .icon-btn:hover { color: #4f46e5; }
    .icon-btn.danger:hover { color: #b91c1c; }

    .log-row-edit { display: none; margin-top: 10px; }
    .log-row-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .log-row-fields select, .log-row-fields input {
      width: 100%;
      padding: 7px 8px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #1a1a1a;
      background: #fafafa;
    }
    .log-row-fields select:focus, .log-row-fields input:focus { outline: none; border-color: #4f46e5; background: #fff; }

    .btn-small {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 12px;
    }
    .btn-small.save { background: #4f46e5; color: #fff; }
    .btn-small.save:hover { background: #4338ca; }
    .btn-small.cancel { background: #f3f4f6; color: #374151; }
    .btn-small.cancel:hover { background: #e5e7eb; }

    .empty-note { color: #9ca3af; font-size: 0.88rem; text-align: center; padding: 12px 0; }

    .error-note {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.88rem;
      width: 100%;
      max-width: 460px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="top-row">
    <h1>Dashboard</h1>
    <div>
      <a class="back-link" href="/library.html">📚 Library</a>
      <a class="back-link" href="/" style="margin-left:14px;">← Back to logger</a>
    </div>
  </div>

  <div class="error-note" id="errorNote"></div>

  <div class="card">
    <div class="section-title">Today</div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="num" id="todayCalories">—</div>
        <div class="label">kcal</div>
      </div>
      <div class="stat-box">
        <div class="num" id="todayProtein">—</div>
        <div class="label">g protein</div>
      </div>
    </div>
    <div class="log-list" id="todayLogList"></div>
  </div>

  <div class="card">
    <div class="section-title">Last 7 days average</div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="num" id="avgCalories">—</div>
        <div class="label">kcal / day</div>
      </div>
      <div class="stat-box">
        <div class="num" id="avgProtein">—</div>
        <div class="label">g protein / day</div>
      </div>
    </div>
  </div>

  <script>
    const MEAL_TYPES = ["Breakfast", "Lunch", "Dinner", "Snacks", "Protein"];

    // The date every row in today's list belongs to — set by loadDashboard(),
    // needed as the "date" field when PUT-ing an edit (the entry's day doesn't
    // change here, only its other fields).
    let currentDate = "";

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function todayIso() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${now.getFullYear()}-${mm}-${dd}`;
    }

    function mealTypeOptionsHtml(selected) {
      return MEAL_TYPES.map(mt =>
        `<option value="${mt}"${mt === selected ? " selected" : ""}>${mt}</option>`
      ).join("");
    }

    function logRowHtml(log) {
      return `
        <div class="log-row" data-id="${esc(log.id)}">
          <div class="log-row-view">
            <div class="meta">
              <span class="meal-type">${esc(log.meal_type)}</span>
              ${esc(log.item) || "—"}
            </div>
            <div class="nums">${log.calories} kcal · ${log.protein} g</div>
            <div class="log-row-actions">
              <button class="icon-btn" onclick="editLog('${esc(log.id)}')" title="Edit">✎</button>
              <button class="icon-btn danger" onclick="deleteLog('${esc(log.id)}')" title="Delete">✕</button>
            </div>
          </div>
          <div class="log-row-edit">
            <div class="log-row-fields">
              <select class="f-meal-type">${mealTypeOptionsHtml(log.meal_type)}</select>
              <input type="text" class="f-item" value="${esc(log.item)}" placeholder="Item" />
              <input type="number" class="f-calories" min="0" value="${log.calories}" placeholder="Calories" />
              <input type="number" class="f-protein" min="0" value="${log.protein}" placeholder="Protein" />
            </div>
            <div class="log-row-actions">
              <button class="btn-small save" onclick="saveLog('${esc(log.id)}')">Save</button>
              <button class="btn-small cancel" onclick="cancelEditLog('${esc(log.id)}')">Cancel</button>
            </div>
          </div>
        </div>`;
    }

    function renderLogList(logs) {
      const el = document.getElementById("todayLogList");
      el.innerHTML = logs.length
        ? logs.map(logRowHtml).join("")
        : '<div class="empty-note">Nothing logged yet today.</div>';
    }

    function logRow(id) {
      return document.querySelector(`.log-row[data-id="${id}"]`);
    }

    function editLog(id) {
      const row = logRow(id);
      row.querySelector(".log-row-view").style.display = "none";
      row.querySelector(".log-row-edit").style.display = "block";
    }

    function cancelEditLog(id) {
      const row = logRow(id);
      row.querySelector(".log-row-edit").style.display = "none";
      row.querySelector(".log-row-view").style.display = "flex";
    }

    async function saveLog(id) {
      const row = logRow(id);
      const fd = new FormData();
      fd.append("date", currentDate);
      fd.append("meal_type", row.querySelector(".f-meal-type").value);
      fd.append("item", row.querySelector(".f-item").value.trim());
      fd.append("calories", row.querySelector(".f-calories").value || "0");
      fd.append("protein", row.querySelector(".f-protein").value || "0");

      try {
        const res = await fetch(`/logs/${encodeURIComponent(id)}`, { method: "PUT", body: fd });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
        await loadDashboard(); // re-fetch so today's totals and the 7-day average pick up the edit
      } catch (err) {
        const el = document.getElementById("errorNote");
        el.textContent = `Could not save: ${err.message}`;
        el.style.display = "block";
      }
    }

    async function deleteLog(id) {
      if (!confirm("Delete this log entry? This can't be undone.")) return;

      try {
        const res = await fetch(`/logs/${encodeURIComponent(id)}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
        await loadDashboard();
      } catch (err) {
        const el = document.getElementById("errorNote");
        el.textContent = `Could not delete: ${err.message}`;
        el.style.display = "block";
      }
    }

    async function loadDashboard() {
      currentDate = todayIso();
      try {
        const res = await fetch(`/dashboard?date=${encodeURIComponent(currentDate)}`);
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || `Server error ${res.status}`);
        }

        document.getElementById("todayCalories").textContent = data.today.calories;
        document.getElementById("todayProtein").textContent = data.today.protein;
        renderLogList(data.today.logs);

        document.getElementById("avgCalories").textContent = data.last_7_days.calories_avg;
        document.getElementById("avgProtein").textContent = data.last_7_days.protein_avg;
      } catch (err) {
        const el = document.getElementById("errorNote");
        el.textContent = `Could not load dashboard: ${err.message}`;
        el.style.display = "block";
      }
    }

    loadDashboard();
  </script>
</body>
</html>
